<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Action Challenge</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Background decorative glowing circles for glassmorphism effect */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(56, 189, 248, 0.15);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            top: 10%;
            left: 20%;
        }

        .bg-glow-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(244, 63, 94, 0.15);
            filter: blur(90px);
            border-radius: 50%;
            z-index: -1;
            bottom: 10%;
            right: 20%;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.4rem;
            color: #ffffff;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 1rem;
            color: #38bdf8;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Glassmorphism Container */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .score-board {
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: 600;
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.07);
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        canvas {
            border: 2px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(2, 6, 23, 0.6);
            border-radius: 12px;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .instructions {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            letter-spacing: 0.3px;
        }

        /* On-Screen Controls Style */
        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }

        .controls-row {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f8fafc;
            width: 50px;
            height: 45px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active {
            background: rgba(56, 189, 248, 0.3);
            border-color: #38bdf8;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <header>
        <h1>Praveer Samanta</h1>
        <p class="subtitle">GitHub Action Challenge</p>
    </header>

    <div class="game-container">
        <div class="score-board">Score: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="360" height="360"></canvas>
        <div class="instructions">Use Keyboard Arrow Keys or On-Screen Buttons</div>
        
        <!-- On-Screen D-Pad Controls -->
        <div class="controls-container">
            <button class="control-btn" id="upBtn">▲</button>
            <div class="controls-row">
                <button class="control-btn" id="leftBtn">◀</button>
                <button class="control-btn" id="downBtn">▼</button>
                <button class="control-btn" id="rightBtn">▶</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let changingDirection = false;

        // Start game loop
        let gameInterval = setInterval(main, 100);

        function main() {
            if (hasGameEnded()) {
                clearInterval(gameInterval);
                alert("Game Over! Final Score: " + score);
                resetGame();
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "rgba(2, 6, 23, 0.8)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#38bdf8" : "#0ea5e9";
                ctx.shadowBlur = index === 0 ? 10 : 0;
                ctx.shadowColor = "#38bdf8";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
                ctx.shadowBlur = 0; // Reset shadow
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            snake.forEach(part => {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) generateFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#f43f5e";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#f43f5e";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0; // Reset shadow
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        // Direction Changer Handler
        function changeDirectionByKeyCode(keyCode) {
            const LEFT_KEY = 37;
            const UP_KEY = 38;
            const RIGHT_KEY = 39;
            const DOWN_KEY = 40;

            if (changingDirection) return;

            if (keyCode === LEFT_KEY && dx === 0) {
                dx = -1;
                dy = 0;
                changingDirection = true;
            }
            if (keyCode === UP_KEY && dy === 0) {
                dx = 0;
                dy = -1;
                changingDirection = true;
            }
            if (keyCode === RIGHT_KEY && dx === 0) {
                dx = 1;
                dy = 0;
                changingDirection = true;
            }
            if (keyCode === DOWN_KEY && dy === 0) {
                dx = 0;
                dy = 1;
                changingDirection = true;
            }
        }

        function changeDirection(event) {
            changeDirectionByKeyCode(event.keyCode);
        }

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            generateFood();
            gameInterval = setInterval(main, 100);
        }

        // Keyboard Event Listener
        generateFood();
        document.addEventListener("keydown", changeDirection);

        // On-Screen Buttons Event Listeners
        document.getElementById("leftBtn").addEventListener("click", () => changeDirectionByKeyCode(37));
        document.getElementById("upBtn").addEventListener("click", () => changeDirectionByKeyCode(38));
        document.getElementById("rightBtn").addEventListener("click", () => changeDirectionByKeyCode(39));
        document.getElementById("downBtn").addEventListener("click", () => changeDirectionByKeyCode(40));
    </script>
</body>
</html>
